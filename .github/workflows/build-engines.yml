name: Build engines

# CI builds the engine outside the launcher. The launcher never compiles an
# engine and never links against reims-vgpu, metal2vulkan or reims-util.
# Revisions come from repository variables so a pinned upstream SHA can be
# changed without editing the workflow.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Engine channel to build
        required: true
        type: choice
        default: master
        options: [master, development, patched]
      publish:
        description: Publish archives to GitHub Releases
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "engines/**"

permissions:
  contents: write

env:
  VGPU_REPO: https://github.com/steelbrain/reims-vgpu.git
  QEMU_REPO: https://github.com/steelbrain/qemu-reims-vgpu.git
  VGPU_REF: ${{ vars.VGPU_REF || 'master' }}
  # Upstream has no `reims-graphics` branch; the QEMU changes live on
  # `steelbrain/reims-vgpu`. Pin that branch's commit for reproducibility.
  QEMU_REF: ${{ vars.QEMU_REF || '1f6f4ea455370bd8f26cebf3de8304bb1fefb945' }}
  # Only the rebase-2 branch enables reims-vgpu on Windows hosts.
  QEMU_REF_WINDOWS: ${{ vars.QEMU_REF_WINDOWS || 'b057a987feb64adf641921082fffaf7611373182' }}
  CHANNEL: ${{ inputs.channel || 'master' }}
  PUBLISH: ${{ inputs.publish || github.event_name == 'push' }}

jobs:
  windows:
    name: Windows engine (CLANG64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone pinned upstream revisions
        shell: bash
        env:
          QEMU_REF: ${{ env.QEMU_REF_WINDOWS }}
        run: bash scripts/ci/clone-upstream.sh

      - name: Install MSYS2 build dependencies
        # Package list mirrors msys2_pkgs in upstream scripts/install-ctl.sh.
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git curl diffutils make
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-glib2
            mingw-w64-clang-x86_64-pixman mingw-w64-clang-x86_64-libslirp
            mingw-w64-clang-x86_64-gtk3 mingw-w64-clang-x86_64-libusb
            mingw-w64-clang-x86_64-zstd mingw-w64-clang-x86_64-libva
            mingw-w64-clang-x86_64-mesa

      - name: Install the pinned Rust toolchain (gnullvm host)
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-03-x86_64-pc-windows-gnullvm
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal `
            -c rustfmt -c clippy --no-self-update
          rustup default $env:RUSTUP_TOOLCHAIN

      - name: Check patch queue
        if: env.CHANNEL == 'patched'
        shell: bash
        run: |
          shopt -s nullglob
          for patch in patches/*.patch; do
            git -C upstream/reims-vgpu apply --check "../../$patch"
            git -C upstream/reims-vgpu apply "../../$patch"
          done

      - name: Build QEMU and the engine tools
        shell: msys2 {0}
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-03-x86_64-pc-windows-gnullvm
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          cd upstream/reims-vgpu
          # The Makefile asks ninja for `qemu-system-x86_64`; the Windows
          # meson target is `qemu-system-x86_64.exe`. Patch only this ephemeral
          # checkout; the upstream repository stays untouched.
          sed -i 's/ qemu-system-x86_64$/ qemu-system-x86_64.exe/' Makefile
          rustc --version
          rm -rf build/qemu
          make qemu QEMU_CONFIGURE="--target-list=x86_64-softmmu --enable-libusb --disable-docs --disable-debug-info --disable-guest-agent --disable-werror"
          # `make qemu` builds only the system emulator; the bundle needs
          # qemu-img too, as upstream's install-ctl.sh gets from ninja all.
          ninja -C build/qemu qemu-img.exe || ninja -C build/qemu

      - name: Collect binaries and assert device support
        id: collect
        shell: msys2 {0}
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-03-x86_64-pc-windows-gnullvm
          BINARY_SUFFIX: .exe
        run: bash scripts/ci/collect-bundle.sh

      - name: Build the static GPU selection layer
        shell: msys2 {0}
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
          TARGET: x86_64-pc-windows-msvc
        run: bash scripts/ci/build-layer.sh

      - name: Embed UTF-8 and longPathAware manifests
        shell: pwsh
        run: |
          $sdkBin = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $mt = Get-ChildItem $sdkBin -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) { throw 'mt.exe from the Windows SDK was not found' }
          $bundle = "upstream/reims-vgpu/bundle/bin"
          foreach ($binary in @("qemu-system-x86_64.exe", "reims-vgpu-compile.exe")) {
            $path = Join-Path $bundle $binary
            & $mt -nologo -manifest scripts/app.manifest "-outputresource:$path;#1"
          }

      - name: Generate manifest.json
        shell: msys2 {0}
        env:
          QEMU_REF: ${{ env.QEMU_REF_WINDOWS }}
          OS_NAME: windows
          ENGINE_PREFIX: win64
          VIDEO_PROP: ${{ steps.collect.outputs.video_prop }}
          VA_DRIVER: ${{ steps.collect.outputs.va_driver }}
        run: bash scripts/ci/generate-manifest.sh

      - name: Pack the archive
        shell: msys2 {0}
        env:
          ENGINE_PREFIX: win64
        run: bash scripts/ci/pack.sh

      - name: Upload the engine archive
        uses: actions/upload-artifact@v6
        with:
          name: engine-win64-${{ env.CHANNEL }}
          path: upstream/reims-vgpu/*.tar.zst
          if-no-files-found: error

  linux:
    name: Linux engine (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h .

      - name: Install build dependencies
        # Mirrors apt_pkgs in upstream scripts/install-ctl.sh; SDL3's cmake
        # build needs the X11/Wayland/EGL development headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates pkg-config python3 python3-venv \
            ninja-build flex bison bzip2 cmake binutils clang lld make \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev libfdt-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev libusb-1.0-0-dev \
            libspice-server-dev libgnutls28-dev libvulkan1 vulkan-tools zstd \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libwayland-bin libdecor-0-dev \
            libegl-dev libgl-dev libdrm-dev libgbm-dev libdbus-1-dev \
            libudev-dev libgtk-3-dev

      - name: Clone pinned upstream revisions
        run: bash scripts/ci/clone-upstream.sh

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-11-03 --profile minimal \
            -c rustfmt -c clippy --no-self-update
          rustup default nightly-2026-11-03

      - name: Check patch queue
        if: env.CHANNEL == 'master'
        run: echo "Clean upstream channel; no patches to apply."

      - name: Install Python 3.12 for QEMU's meson
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build QEMU and the engine tools
        # Mirror upstream scripts/install-ctl.sh: rustup proxies first on PATH,
        # no RUSTUP_TOOLCHAIN override, and stock GNU binutils nm with the
        # LLVM plugin hidden and Python >= 3.12 from setup-python.
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          which cargo nm
          nm --version | head -n 1
          # GNU nm loads LLVMgold from /usr/lib/bfd-plugins and aborts on the
          # bitcode rustc embeds in the staticlib. Hide it for this build.
          if [ -d /usr/lib/bfd-plugins ]; then
            sudo mv /usr/lib/bfd-plugins /usr/lib/bfd-plugins.disabled
          fi
          cd upstream/reims-vgpu
          # xtask calls `nm` by bare name; call GNU binutils absolutely.
          grep -rl 'output("nm"\|run("nm"' xtask/src | while read -r source_file; do
            sed -i 's/output("nm",/output("\/usr\/bin\/nm",/g; s/run("nm",/run("\/usr\/bin\/nm",/g' "$source_file"
          done
          rustc --version
          rm -rf build/qemu
          make qemu QEMU_CONFIGURE="--target-list=x86_64-softmmu --enable-libusb --disable-docs --disable-debug-info --disable-guest-agent --disable-werror"
          # `make qemu` builds only qemu-system-x86_64; the bundle needs
          # qemu-img too, as upstream's install-ctl.sh gets from ninja all.
          ninja -C build/qemu qemu-img || ninja -C build/qemu

      - name: Collect binaries and assert device support
        id: collect
        env:
          BINARY_SUFFIX: ""
        run: bash scripts/ci/collect-bundle.sh

      - name: Build the static GPU selection layer
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: bash scripts/ci/build-layer.sh

      - name: Generate manifest.json
        env:
          OS_NAME: linux
          ENGINE_PREFIX: linux64
          VIDEO_PROP: ${{ steps.collect.outputs.video_prop }}
        run: bash scripts/ci/generate-manifest.sh

      - name: Pack the archive
        env:
          ENGINE_PREFIX: linux64
        run: bash scripts/ci/pack.sh

      - name: Upload the engine archive
        uses: actions/upload-artifact@v6
        with:
          name: engine-linux64-${{ env.CHANNEL }}
          path: upstream/reims-vgpu/*.tar.zst
          if-no-files-found: error

  publish-index:
    name: Publish index and signatures
    needs: [windows, linux]
    if: ${{ inputs.publish || github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Download the built engine archives
        uses: actions/download-artifact@v6
        with:
          pattern: engine-*-*
          path: assets
          merge-multiple: true

      - name: Build index.json
        run: |
          set -euo pipefail
          python3 scripts/make_index.py \
            --assets assets \
            --base-url "https://github.com/${{ github.repository }}/releases/download/engines-$CHANNEL" \
            --output index.json

      - name: Publish archives and indexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="engines-$CHANNEL"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Engines $CHANNEL" --generate-notes
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            assets/*.tar.zst index.json \
            "$(pwd)/crates/core/tests/fixtures/signatures.json"
