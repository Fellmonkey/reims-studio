[workspace]
members = ["crates/core", "crates/platform", "crates/engine-mgr"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Fellmonkey/reims-studio"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "macros", "rt", "time"] }
fs2 = "0.4.3"
sysinfo = "0.40.4"
regex = "1.13.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
unwrap_used = "warn"
expect_used = "warn"
