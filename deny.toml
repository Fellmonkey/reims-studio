[advisories]
yanked = "deny"
# ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "...", expires = "2027-01-01" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
