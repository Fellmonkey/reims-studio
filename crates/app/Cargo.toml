[package]
name = "reims-studio"
version = "0.1.0"
description = "Portable launcher GUI for Reims Studio"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "canvas", "tokio", "thread-pool", "linux-theme-detection", "x11", "wayland", "advanced", "svg", "image"] }
shadcn-iced = "0.3.1"
reims-core = { version = "0.1.0", path = "../core" }
reims-platform = { version = "0.1.0", path = "../platform" }
reims-engine-mgr = { version = "0.1.0", path = "../engine-mgr" }
rand.workspace = true
toml.workspace = true
ureq.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[lints]
workspace = true
